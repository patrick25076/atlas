# Keeps public/data fresh without anyone's laptop. Every source here is free and needs no key.
# A commit by this workflow redeploys production (Vercel builds every push to main).
name: Refresh data

on:
  schedule:
    - cron: "15 3 * * *" # daily: weather, rates, advisories, airports, airlines, cities, holidays
    - cron: "45 3 * * 1" # weekly (Monday): towns, ground graph (GTFS)
    - cron: "30 4 1 * *" # monthly (1st): Overture places and ferries, heritage, visa
  workflow_dispatch:
    inputs:
      set:
        description: "Which set to refresh"
        type: choice
        default: daily
        options: [daily, weekly, monthly, all]

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Decide the set
        id: set
        run: |
          case "${{ github.event.schedule }}" in
            "15 3 * * *") echo "set=daily" >> "$GITHUB_OUTPUT" ;;
            "45 3 * * 1") echo "set=weekly" >> "$GITHUB_OUTPUT" ;;
            "30 4 1 * *") echo "set=monthly" >> "$GITHUB_OUTPUT" ;;
            *) echo "set=${{ inputs.set || 'daily' }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Daily sources
        if: steps.set.outputs.set == 'daily' || steps.set.outputs.set == 'all'
        run: |
          pnpm ingest:airports
          pnpm ingest:tp-airports
          pnpm ingest:tp-airlines
          pnpm ingest:countries
          pnpm ingest:holidays
          pnpm ingest:weather
          DEALS_GATEWAYS=OTP,CLJ,IAS,TSR,SBZ,GHV,CRA pnpm ingest:deals

      - name: Weekly sources
        if: steps.set.outputs.set == 'weekly' || steps.set.outputs.set == 'all'
        run: |
          pnpm ingest:geonames
          pnpm ingest:gtfs
          DEALS_GATEWAYS=OTP,CLJ,IAS,TSR pnpm ingest:oneway

      - name: Monthly sources
        if: steps.set.outputs.set == 'monthly' || steps.set.outputs.set == 'all'
        run: |
          pnpm ingest:heritage
          pnpm ingest:visa
          pnpm ingest:ferries
          pnpm ingest:overture
          pnpm ingest:gtfs

      - name: Commit what changed
        run: |
          git config user.name "atlas-refresh"
          git config user.email "atlas-refresh@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "data: ${{ steps.set.outputs.set }} refresh $(date -u +%F)"
            # main may have moved while the ingests ran; replay on top, keeping this run's data.
            git pull --rebase -X theirs origin main
            git push
          fi
