# Keeps the data fresh without anyone's laptop. Every source here is free and needs no key,
# except the Blob store the price boards and hotel snapshots are written to
# (BLOB_READ_WRITE_TOKEN secret), LiteAPI for the hotel snapshot (LITEAPI_KEY secret) and
# the optional Postgres (DATABASE_URL secret, empty until the database is reachable).
# A commit by the refresh job redeploys production (Vercel builds every push to main). The
# boards and hotels jobs write to Blob only and commit nothing. The repository is public, so
# Actions minutes are unlimited; the schedules below cost nothing.
name: Refresh data

on:
  schedule:
    - cron: "15 3 * * *" # daily: weather, rates, advisories, airports, airlines, cities, holidays
    - cron: "45 3 * * 1" # weekly (Monday): towns, ground graph (GTFS), one-way fares
    - cron: "30 4 1 * *" # monthly (1st): Overture places and ferries, heritage, visa, fame, costs, climate
    - cron: "0 1 * * *" # nightly: price boards for ~150 airports straight to Blob, then the hotel snapshot
  workflow_dispatch:
    inputs:
      set:
        description: "Which set to refresh"
        type: choice
        default: daily
        options: [daily, weekly, monthly, boards, hotels, flights, map, bench, all]

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.schedule != '0 1 * * *' && inputs.set != 'boards' && inputs.set != 'hotels' && inputs.set != 'flights' && inputs.set != 'map' && inputs.set != 'bench'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: refresh-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Decide the set
        id: set
        run: |
          case "${{ github.event.schedule }}" in
            "15 3 * * *") echo "set=daily" >> "$GITHUB_OUTPUT" ;;
            "45 3 * * 1") echo "set=weekly" >> "$GITHUB_OUTPUT" ;;
            "30 4 1 * *") echo "set=monthly" >> "$GITHUB_OUTPUT" ;;
            *) echo "set=${{ inputs.set || 'daily' }}" >> "$GITHUB_OUTPUT" ;;
          esac

      # Every source runs on its own: one upstream blip (Travelpayouts answered 404 for its
      # city list on the morning of 10 October 2026 and took weather and holidays down with
      # it) must not stop the others. A source gets a second try after 30 seconds; when both
      # fail its previous file stays, the rest are still committed, and the last step fails
      # the run with the names so the failure is visible.
      - name: Daily sources
        if: steps.set.outputs.set == 'daily' || steps.set.outputs.set == 'all'
        run: |
          source .github/run-source.sh
          for s in ingest:airports ingest:tp-airports ingest:tp-airlines ingest:countries ingest:holidays ingest:weather; do run_source "$s"; done

      - name: Weekly sources
        if: steps.set.outputs.set == 'weekly' || steps.set.outputs.set == 'all'
        run: |
          source .github/run-source.sh
          run_source ingest:geonames
          run_source ingest:gtfs
          export DEALS_GATEWAYS=OTP,CLJ,IAS,TSR
          run_source ingest:oneway

      - name: Monthly sources
        if: steps.set.outputs.set == 'monthly' || steps.set.outputs.set == 'all'
        run: |
          source .github/run-source.sh
          for s in ingest:heritage ingest:visa ingest:ferries ingest:overture ingest:gtfs ingest:fame ingest:costs; do run_source "$s"; done
          # Climate normals per city (public/data/climate.json, NASA POWER); resumable, so a
          # month that runs out of time continues where it stopped the next month.
          run_source ingest:climate

      - name: Commit what changed
        run: |
          git config user.name "atlas-refresh"
          git config user.email "atlas-refresh@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "data: ${{ steps.set.outputs.set }} refresh $(date -u +%F)"
            # main may have moved while the ingests ran; replay on top, keeping this run's data.
            git pull --rebase -X theirs origin main
            git push
          fi

      - name: Report sources that failed twice
        run: |
          if [ -s "$RUNNER_TEMP/failed-sources.txt" ]; then
            echo "::error::these sources kept their previous data: $(tr '\n' ' ' < "$RUNNER_TEMP/failed-sources.txt")"
            exit 1
          fi
          echo "every source refreshed"

  # Each shard runs on its own runner (its own address): Kiwi throttles an address after a
  # couple of thousand searches, and 150 airports need about 6,000. Eight shards, fifteen
  # minutes each, every night.
  boards:
    if: github.event.schedule == '0 1 * * *' || inputs.set == 'boards' || inputs.set == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Search and store the boards
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          BOARDS_SHARD: ${{ matrix.shard }}/8
        run: pnpm ingest:boards

  # The flight graph (docs/plans/flight-graph.md): 164 airports, one one-way "anywhere"
  # search per 3-day bucket for six weeks, every itinerary an edge, written to Blob as
  # graph/flights/<date>/shard-<i>.json with graph/flights/latest.json naming the shards. Eight
  # shards on eight runners (eight addresses), about 290 searches each (2,296 a night), so no address comes near
  # Kiwi's limit. Same nightly cron as the boards and needs nothing: each runner has its own
  # address, so running beside the boards costs neither of them a search. DATABASE_URL lets every
  # search also land in the fare memory, as every live search does.
  flight-edges:
    if: github.event.schedule == '0 1 * * *' || inputs.set == 'flights' || inputs.set == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Search one-way edges and store the shard
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FLIGHT_SHARD: ${{ matrix.shard }}/8
          # Only this job writes where the site reads; any other run is a test under graph/flights/test-<date>/.
          FLIGHT_PRODUCTION: "1"
        run: pnpm ingest:flight-edges

  # The hotel snapshot: 80 cities, two LiteAPI calls each, one standard weekend four weeks
  # out, into Blob (hotels/snapshot-<date>.json, hotels/latest.json) and into Postgres when
  # DATABASE_URL is set. Runs after the boards so the two never overlap; runs even when a
  # boards shard failed or the boards job was skipped (a "hotels" dispatch).
  hotels:
    needs: [boards]
    if: ${{ !cancelled() && (github.event.schedule == '0 1 * * *' || inputs.set == 'hotels' || inputs.set == 'all') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Snapshot the cheapest decent hotel per city
        env:
          LITEAPI_KEY: ${{ secrets.LITEAPI_KEY }}
          LITEAPI_ENV: production
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm ingest:hotels

  # The breadth of the price map (docs/plans/one-brain.md): Travelpayouts' cache of recent Aviasales fares for about
  # 250 departure cities, the cheapest to every place and of every day, three months ahead, into Blob
  # (graph/tp/latest.json). Free and outside Kiwi's limit; about 1,400 calls, five minutes.
  tp-edges:
    if: github.event.schedule == '0 1 * * *' || inputs.set == 'map' || inputs.set == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Read the Travelpayouts cache into the price map
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          TP_PRODUCTION: "1"
        run: pnpm ingest:tp-edges

  # The benchmark (scripts/bench.ts): every question of bench/cases.json through the classic engines and the one
  # brain on tonight's map, stored prices only (no live search), scored and stored as bench/latest.json for the
  # engine room. After the flight graph and the map so it scores tonight's data.
  bench:
    needs: [flight-edges, tp-edges]
    if: ${{ !cancelled() && (github.event.schedule == '0 1 * * *' || inputs.set == 'bench' || inputs.set == 'all') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Score every brain on the benchmark
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
        run: pnpm bench
